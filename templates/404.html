<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>404 Not Found - Chat App</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <link rel="icon" href="{{ url_for('static', filename='favicon.png') }}" type="image/png">
    <!-- Google Fonts (Optional) -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
</head>
<body>
    <div class="container error-container">
        <div class="header"><h1>404 - Page Not Found</h1></div>
        <div class="main">
            <p style="font-size: 1.1em; color: var(--muted-color);">Oops! The page you are looking for doesn't seem to exist.</p>
            <p>It might have been moved, deleted, or maybe you typed the address incorrectly.</p>
            <div class="error-actions">
                <a href="{{ url_for('home') }}" class="btn btn-primary">Go to Homepage</a>
                {% if 'user_id' in session %}
                <a href="{{ url_for('dashboard') }}" class="btn btn-secondary">Go to Dashboard</a>
                {% endif %}
            </div>
        </div>
    </div>
</body>
</html>
<!-- END OF FILE 404.html -->
