<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>404 Not Found - Chat App</title>
    
    <link rel="icon" href="{{ url_for('static', filename='favicon.png') }}" type="image/png">
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Animate.css for animations -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css">
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; }
    </style>
</head>
<body class="bg-gradient-to-br from-gray-500 via-gray-600 to-gray-700 min-h-screen flex items-center justify-center p-4">
    <div class="bg-white rounded-2xl shadow-2xl w-full max-w-md p-8 text-center animate__animated animate__fadeInUp">
        <div class="mb-8">
            <h1 class="text-6xl font-bold text-gray-800 mb-4 animate__animated animate__bounce">404</h1>
            <h2 class="text-2xl font-semibold text-gray-700 mb-4">Page Not Found</h2>
            <p class="text-gray-600 mb-6">Oops! The page you are looking for doesn't seem to exist. It might have been moved, deleted, or maybe you typed the address incorrectly.</p>
        </div>
        <div class="space-y-4">
            <a href="{{ url_for('home') }}" class="inline-block w-full bg-gradient-to-r from-blue-600 to-purple-600 text-white py-3 px-4 rounded-lg hover:from-blue-700 hover:to-purple-700 transition-all duration-200 transform hover:scale-105 animate__animated animate__pulse">
                Go to Homepage
            </a>
            {% if 'user_id' in session %}
            <a href="{{ url_for('dashboard') }}" class="inline-block w-full bg-gray-100 text-gray-800 py-3 px-4 rounded-lg hover:bg-gray-200 transition-all duration-200 transform hover:scale-105">
                Go to Dashboard
            </a>
            {% endif %}
        </div>
    </div>
</body>
</html>
<!-- END OF FILE 404.html -->
