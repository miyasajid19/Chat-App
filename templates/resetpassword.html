<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reset Password - Chat App</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <link rel="icon" href="{{ url_for('static', filename='favicon.png') }}" type="image/png">
</head>
<body>
    <div class="container auth-container">
        <div class="header">
            <h1>Set New Password</h1>
        </div>
        <div class="main">
            <!-- Flash Messages -->
            {% include 'includes/_flash_messages.html' %}

            <form action="{{ url_for('reset_password') }}" method="post" class="auth-form">
                <h2>Reset Your Password</h2>
                <p>Please enter the 6-digit OTP sent to your email address and set a new password (minimum 6 characters).</p>

                <div class="form-group">
                     <label for="otp" class="sr-only">OTP:</label>
                    <input id="otp" name="otp" type="text" inputmode="numeric" placeholder="Enter 6-Digit OTP" required pattern="\d{6}" title="Enter the 6-digit code" maxlength="6">
                </div>

                <div class="form-group">
                     <label for="new_password" class="sr-only">New Password:</label>
                    <input id="new_password" name="new_password" type="password" placeholder="New Password (min. 6 characters)" required minlength="6">
                </div>

                <div class="form-group">
                     <label for="confirm_password" class="sr-only">Confirm New Password:</label>
                    <input id="confirm_password" name="confirm_password" type="password" placeholder="Confirm New Password" required minlength="6">
                </div>

                <div class="form-group">
                    <button type="submit" id="reset_password" class="btn btn-primary btn-block">Reset Password</button>
                </div>

                <div class="form-links">
                    <a href="{{ url_for('forget_password') }}">Request new OTP?</a> |
                    <a href="{{ url_for('home') }}">Back to Login</a>
                </div>
            </form>
        </div>
    </div>
</body>
</html>
