<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chat Room - {{ room_code }}</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <link rel="icon" href="{{ url_for('static', filename='favicon.png') }}" type="image/png">
</head>

<body>
    <div class="container chat-container">
        <div class="header">
            <h1>Private Chat</h1>
            <div class="header-links">
                <a href="{{ url_for('dashboard') }}">Dashboard</a>
            </div>
        </div>
        <div class="main">
            <h2 class="room-code-display">Room Code: <span class="code">{{ room_code }}</span></h2>

            <div class="messages" id="messages">
                <!-- Messages loaded here -->
            </div>

            <!-- Flash Messages Area within chat -->
            <div id="chat-flash-messages"></div>

            <div class="send_message">
                <label for="message" class="sr-only">Message:</label>
                <textarea id="message" placeholder="Type your message..." aria-label="Type your message"
                    rows="1"></textarea>
                <button type="button" id="send-btn" aria-label="Send Message">
                    <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor"
                        class="bi bi-send-fill" viewBox="0 0 16 16">
                        <path
                            d="M15.964.686a.5.5 0 0 0-.65-.65L.767 5.855H.766l-.452.18a.5.5 0 0 0-.082.887l.41.26.001.002 4.995 3.178 3.178 4.995.002.001.26.41a.5.5 0 0 0 .886-.083l6-15Zm-1.833 1.89L6.637 10.07l-.215-.338a.5.5 0 0 0-.154-.154l-.338-.215 7.494-7.494 1.178-.471-.47 1.178Z" />
                    </svg>
                </button>
            </div>
        </div>
    </div>

    <!-- Include Socket.IO Client Library -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/socket.io/4.7.4/socket.io.min.js"></script>

    <!-- Chat Room JavaScript (Includes History Handling) -->
    <script type="text/javascript">
        // --- Configuration ---
        const currentUser = "{{ username }}"; // Username passed from Flask
        const roomCode = "{{ room_code }}";   // Room code passed from Flask

        // --- DOM Elements ---
        const socketio = io(); // Connect automatically
        const messageContainer = document.getElementById("messages");
        const messageInput = document.getElementById("message");
        const sendButton = document.getElementById("send-btn");
        const flashContainer = document.getElementById("chat-flash-messages");

        // --- Helper Functions ---
        const formatTimestamp = (isoString) => {
            if (!isoString) return '';
            try {
                const date = new Date(isoString);
                if (isNaN(date.getTime())) { console.warn("Invalid timestamp received:", isoString); return ''; }
                return date.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
            } catch (e) { console.error("Error formatting timestamp:", isoString, e); return ''; }
        };
        const sanitize = (text) => {
            const temp = document.createElement('div'); temp.textContent = text; return temp.innerHTML;
        };
        const createMessageElement = (name, msg, timestamp, userId, isSystem = false) => {
            const messageElement = document.createElement("div");
            messageElement.classList.add("message-item");
            const safeName = sanitize(name), safeMsg = sanitize(msg), formattedTime = formatTimestamp(timestamp);

            if (isSystem) {
                messageElement.classList.add("system-message");
                // System messages have simpler structure (no bubble)
                messageElement.innerHTML = `<span class="message-content">${safeMsg}</span>`;
                // Optionally add timestamp for system messages if needed
                // messageElement.innerHTML += `<span class="message-timestamp">${formattedTime}</span>`;
            } else {
                const messageBubble = document.createElement("div");
                messageBubble.classList.add("message-bubble");

                // Always create sender span, but hide for sent messages via CSS
                const senderSpan = `<strong class="message-sender">${safeName}</strong>`;
                const contentSpan = `<span class="message-content">${safeMsg}</span>`; // Use safeMsg here
                messageBubble.innerHTML = senderSpan + contentSpan;

                const timestampSpan = `<span class="message-timestamp">${formattedTime}</span>`;

                messageElement.appendChild(messageBubble);
                messageElement.insertAdjacentHTML('beforeend', timestampSpan); // Add timestamp after bubble

                if (name === currentUser) {
                    messageElement.classList.add("sent-message");
                } else {
                    messageElement.classList.add("received-message");
                }
            }

            messageContainer.appendChild(messageElement);
            scrollToBottom(); // Scroll after adding any message
        };


        const scrollToBottom = (force = false) => {
            // Scroll down if user is near the bottom OR if force is true (e.g., after history load)
            const isScrolledToBottom = messageContainer.scrollHeight - messageContainer.clientHeight <= messageContainer.scrollTop + 150; // 150px tolerance
            if (isScrolledToBottom || force) {
                 // Use setTimeout to allow DOM to update before scrolling
                 setTimeout(() => {
                    messageContainer.scrollTop = messageContainer.scrollHeight;
                    // console.log("Scrolled to bottom. Forced:", force); // Debug log
                 }, 0);
            }
        };

        const showFlashMessage = (message, category = 'info') => {
            const flashElement = document.createElement('div');
            const alertCategory = (category === 'error') ? 'danger' : category;
            flashElement.className = `alert alert-${alertCategory}`;
            flashElement.textContent = message;
            flashContainer.appendChild(flashElement);
            setTimeout(() => {
                flashElement.style.opacity = '0';
                setTimeout(() => flashElement.remove(), 600);
            }, 4000);
        };

        const setInputState = (enabled) => {
            // console.log("Setting input state to:", enabled); // DEBUG LOG
            messageInput.disabled = !enabled;
            sendButton.disabled = !enabled;
            messageInput.placeholder = enabled ? "Type your message..." : "Connecting...";
            if (enabled) { messageInput.focus(); }
        };

        const showStatusMessage = (message) => {
            messageContainer.innerHTML = ''; // Clear previous messages
            const statusElement = document.createElement('div');
            statusElement.className = "system-message status-indicator"; // Use combined class
            statusElement.innerHTML = `<span class="message-content">${sanitize(message)}</span>`;
            messageContainer.appendChild(statusElement);
        };

        // --- SocketIO Event Handlers ---
        socketio.on("connect", () => {
            console.log("Socket connected (connect event). SID:", socketio.id);
            showStatusMessage("Connected. Loading messages...");
            // History will be requested by server automatically on connect
        });

        socketio.on("disconnect", (reason) => {
            console.warn("Socket disconnected:", reason);
            showStatusMessage(`Disconnected: ${reason}. Attempting to reconnect...`);
            setInputState(false);
        });

        socketio.on("connect_error", (err) => {
            console.error("Connection Error:", err);
            showStatusMessage(`Connection failed: ${err.message}. Please check your connection and refresh.`);
            setInputState(false);
        });

        socketio.on("message_history", (data) => {
            console.log("Received message history:", data); // DEBUG LOG
            messageContainer.innerHTML = ''; // Clear loading/status message
            if (data && data.messages && data.messages.length > 0) {
                data.messages.forEach(msg => {
                    // Determine if a historical message was system (though backend doesn't currently save them)
                    const isSystem = (msg.name === "System");
                    createMessageElement(msg.name, msg.message, msg.timestamp, msg.user_id, isSystem);
                });
            } else {
                // Show welcome message only if history is truly empty
                createMessageElement("System", "Welcome! Start the conversation.", new Date().toISOString(), null, true);
            }
            setInputState(true); // Enable input AFTER history is processed
            scrollToBottom(true); // Force scroll to bottom after history load
        });

        socketio.on("message", (data) => {
            console.log("New message received (socketio.on('message')):", data); // DEBUG LOG

            // Enable input if it was disabled (e.g., if history failed or was empty)
            if (messageInput.disabled) {
                console.log("Input was disabled. Enabling input now."); // DEBUG LOG
                setInputState(true);
                // Clear status message if present
                const statusIndicator = messageContainer.querySelector('.status-indicator');
                if (statusIndicator) { messageContainer.innerHTML = ''; }
            }

            // Process and display the message
            if (data && data.message) {
                const isSystem = (data.name === "System" || data.isSystem === true); // Check name or flag
                createMessageElement(data.name, data.message, data.timestamp, data.user_id, isSystem);
                // scrollToBottom() is called inside createMessageElement
            } else {
                console.warn("Received malformed message:", data);
            }
        });

        socketio.on("error", (data) => {
            console.error("Server Error (socketio.on('error')):", data.message); // DEBUG LOG
            showFlashMessage(`Error: ${data.message}`, 'error');
        });

        // --- Sending Messages ---
        const sendMessage = () => {
            // console.log("sendMessage function called");
            const message = messageInput.value.trim();
            const isDisabled = messageInput.disabled;
            // console.log(`Input value: "${message}"`, `Is disabled: ${isDisabled}`);

            if (message && !isDisabled) {
                // console.log("Message is valid and input is enabled. Emitting...");
                try {
                    // Backend expects message content under 'data' key
                    socketio.emit("message", { data: message });
                    // console.log("socketio.emit('message', ...) executed");
                    messageInput.value = ""; // Clear input
                    messageInput.focus(); // Refocus
                    // Auto-resize textarea after sending
                    messageInput.style.height = 'auto';
                    messageInput.style.height = (messageInput.scrollHeight) + 'px';
                } catch (e) {
                    console.error("Error during socketio.emit or clearing input:", e);
                    showFlashMessage("Error sending message. Check console.", "error");
                }
            } else {
                // console.warn("sendMessage failed: Message empty or input disabled.", `Msg: "${message}", Disabled: ${isDisabled}`);
                if (isDisabled) {
                    showFlashMessage("Cannot send message while disconnected.", "warning");
                }
            }
        };

        // --- Event Listeners ---
        sendButton.addEventListener("click", sendMessage);

        messageInput.addEventListener("keypress", function (event) {
            if (event.key === "Enter" && !event.shiftKey) {
                event.preventDefault(); // Prevent default newline
                sendMessage();
            }
        });

        messageInput.addEventListener('input', function () {
            this.style.height = 'auto'; // Reset height
            // Limit height expansion
            const maxHeight = 100; // Match CSS max-height
            this.style.height = (Math.min(this.scrollHeight, maxHeight)) + 'px';
        }, false);

        // --- Initial Setup ---
        window.onload = () => {
            console.log("Window loaded. Initializing chat..."); // DEBUG LOG
            setInputState(false); // Start with input disabled
            showStatusMessage("Connecting to chat..."); // Initial status
            console.log(`Private chat room '${roomCode}' initializing for user:`, currentUser); // DEBUG LOG
            // Calculate initial height for textarea
            messageInput.style.height = 'auto';
            messageInput.style.height = (messageInput.scrollHeight) + 'px';
            // SocketIO connects automatically, triggering 'connect' event
        };

    </script>

</body>

</html>
