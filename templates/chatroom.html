<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chat Room - {{ room_code }}</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <link rel="icon" href="{{ url_for('static', filename='favicon.png') }}" type="image/png">
    <!-- Google Fonts (Optional) -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
</head>

<body>
    <div class="container chat-container">
        <div class="header">
            <div class="chat-header-info">
                <!-- User Count Display -->
                Users: <span id="user-count-display" class="user-count-display">?</span>
            </div>
            <h1>Private Chat</h1>
            <div class="header-links">
                <a href="{{ url_for('dashboard') }}" title="Leave Room & Go to Dashboard">Dashboard</a>
            </div>
        </div>
        <div class="main">
            <!-- Display Room Code prominently -->
            <h2 class="room-code-display">Room Code: <span class="code">{{ room_code }}</span></h2>

            <!-- Messages Area -->
            <div class="messages" id="messages">
                <!-- System message area/Initial loading message -->
                <div class="system-message status-indicator">Connecting...</div>
            </div>

            <!-- Floating Flash Messages Area (for SocketIO errors etc.) -->
            <div id="chat-flash-messages"></div>

            <!-- Message Input Area -->
            <form class="send_message" id="message-form">
                <label for="message" class="sr-only">Message:</label>
                <textarea id="message" name="message" placeholder="Type your message..." aria-label="Type your message"
                    rows="1" disabled></textarea> {# Start disabled until connected #}
                <button type="submit" id="send-btn" aria-label="Send Message" disabled> {# Start disabled #}
                    <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor"
                        class="bi bi-send-fill" viewBox="0 0 16 16">
                        <path
                            d="M15.964.686a.5.5 0 0 0-.65-.65L.767 5.855H.766l-.452.18a.5.5 0 0 0-.082.887l.41.26.001.002 4.995 3.178 3.178 4.995.002.001.26.41a.5.5 0 0 0 .886-.083l6-15Zm-1.833 1.89L6.637 10.07l-.215-.338a.5.5 0 0 0-.154-.154l-.338-.215 7.494-7.494 1.178-.471-.47 1.178Z" />
                    </svg>
                </button>
            </form>
        </div>
    </div>

    <!-- Socket.IO Client Library -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/socket.io/4.7.5/socket.io.min.js"></script>

    <!-- Chat Room JavaScript -->
    <script type="text/javascript">
        // --- Configuration ---
        const currentUser = "{{ username | e }}"; // Escaped username from Flask
        const roomCode = "{{ room_code | e }}";   // Escaped room code from Flask

        // --- DOM Elements ---
        const socketio = io(); // Auto-connect
        const messageContainer = document.getElementById("messages");
        const messageInput = document.getElementById("message");
        const sendButton = document.getElementById("send-btn");
        const messageForm = document.getElementById("message-form");
        const chatFlashContainer = document.getElementById("chat-flash-messages");
        const userCountDisplay = document.getElementById("user-count-display");

        // --- Helper Functions ---
        const formatTimestamp = (isoString) => {
            if (!isoString) return '';
            try {
                // Use browser's locale settings for time formatting
                const date = new Date(isoString);
                return isNaN(date.getTime()) ? '' : date.toLocaleTimeString([], { hour: 'numeric', minute: '2-digit' });
            } catch (e) { console.error("Timestamp format error:", isoString, e); return ''; }
        };

        const sanitize = (text) => {
            // Basic sanitation: replace HTML brackets to prevent XSS
            // For more robust sanitation, consider a library like DOMPurify if needed.
            if (typeof text !== 'string') text = String(text);
            return text.replace(/</g, "&lt;").replace(/>/g, "&gt;");
        };

        const createMessageElement = (msgData) => {
            const { name, message, timestamp, userId, isSystem = false } = msgData;
            const messageElement = document.createElement("div");
            const safeName = sanitize(name);
            const safeMsg = sanitize(message); // Sanitize message content
            const formattedTime = formatTimestamp(timestamp);

            messageElement.classList.add("message-item");

            if (isSystem) {
                messageElement.classList.add("system-message");
                messageElement.innerHTML = `<span class="message-content">${safeMsg}</span>`;
                // Note: System messages have animation via the class directly
            } else {
                const messageBubble = document.createElement("div");
                messageBubble.classList.add("message-bubble");

                // Conditionally add sender name for received messages
                const senderSpan = (name !== currentUser) ? `<strong class="message-sender">${safeName}</strong>` : '';
                const contentSpan = `<span class="message-content">${safeMsg}</span>`;
                messageBubble.innerHTML = senderSpan + contentSpan;

                const timestampSpan = `<span class="message-timestamp">${formattedTime}</span>`;

                messageElement.appendChild(messageBubble);
                messageElement.insertAdjacentHTML('beforeend', timestampSpan); // Timestamp below bubble

                if (name === currentUser) {
                    messageElement.classList.add("sent-message");
                } else {
                    messageElement.classList.add("received-message");
                }
            }

            messageContainer.appendChild(messageElement);
             // Animation handled by CSS via message-item opacity + transform + keyframes
        };


        const scrollToBottom = (force = false) => {
            // Check if user is scrolled near the bottom before auto-scrolling
            const nearBottom = messageContainer.scrollHeight - messageContainer.clientHeight <= messageContainer.scrollTop + 150; // 150px threshold
            if (force || nearBottom) {
                 // Use setTimeout to ensure DOM is updated before scrolling calculation
                 setTimeout(() => {
                    messageContainer.scrollTop = messageContainer.scrollHeight;
                 }, 50); // Small delay
            }
        };

        const showFlashMessage = (message, category = 'info') => {
            const flashElement = document.createElement('div');
            const alertCategory = (category === 'error') ? 'danger' : category; // Map 'error' to 'danger'
            flashElement.className = `alert alert-${alertCategory}`;
            flashElement.textContent = sanitize(message); // Sanitize flash message
            chatFlashContainer.appendChild(flashElement);
            // Add fade-out animation using class toggle after a delay
            setTimeout(() => {
                flashElement.classList.add('fade-out');
                // Remove element after animation completes
                setTimeout(() => flashElement.remove(), 600); // Corresponds to transition duration
            }, 4000); // Start fading after 4 seconds
        };

        const setInputState = (enabled) => {
            // console.log("Setting input state:", enabled);
            messageInput.disabled = !enabled;
            sendButton.disabled = !enabled;
            messageInput.placeholder = enabled ? "Type your message..." : "Connecting...";
            if (enabled) { messageInput.focus(); }
            // Initial auto-resize
            if (enabled) {
                 autoResizeTextarea();
            }
        };

        const showStatusMessage = (message, isError = false) => {
            messageContainer.innerHTML = ''; // Clear previous messages/status
            const statusElement = document.createElement('div');
            statusElement.className = `system-message status-indicator ${isError ? 'alert-danger' : ''}`;
            statusElement.innerHTML = `<span class="message-content">${sanitize(message)}</span>`;
            messageContainer.appendChild(statusElement);
        };

         const autoResizeTextarea = () => {
             messageInput.style.height = 'auto'; // Temporarily shrink
             const scrollHeight = messageInput.scrollHeight;
             const maxHeight = 100; // Match CSS max-height
             messageInput.style.height = `${Math.min(scrollHeight, maxHeight)}px`;
         };

        // --- SocketIO Event Handlers ---
        socketio.on("connect", () => {
            console.log("Socket.IO: Connected successfully (SID:", socketio.id, ")");
            // Don't immediately clear, wait for history/messages
            setInputState(true); // Enable input now we're connected
            // The server sends history and initial user count
        });

        socketio.on("disconnect", (reason) => {
            console.warn("Socket.IO: Disconnected.", reason);
            showStatusMessage(`Disconnected: ${reason}. Reconnecting...`, true);
            setInputState(false);
            userCountDisplay.textContent = '?'; // Reset count display
        });

        socketio.on("connect_error", (err) => {
            console.error("Socket.IO: Connection Error:", err.message);
            showStatusMessage(`Connection failed: ${err.message}. Check connection and refresh.`, true);
            setInputState(false);
             userCountDisplay.textContent = '?';
        });

        socketio.on("message_history", (data) => {
            console.log("Socket.IO: Received message history. Count:", data?.messages?.length || 0);
            messageContainer.innerHTML = ''; // Clear loading/status message FIRST
            if (data && Array.isArray(data.messages) && data.messages.length > 0) {
                data.messages.forEach(msg => createMessageElement(msg));
            } else {
                // Show a welcome message only if history is empty
                createMessageElement({
                    name: "System", message: "Welcome to the chat! Be the first to send a message.",
                    timestamp: new Date().toISOString(), userId: null, isSystem: true
                });
            }
             // Enable input only after processing history (redundant if done on connect, but safe)
             setInputState(true);
             scrollToBottom(true); // Force scroll after history load
        });

        socketio.on("message", (data) => {
             console.log("Socket.IO: Received message:", data);
             if (!messageInput.disabled) { // Only add if connected
                if (data && data.message) {
                    createMessageElement(data);
                    scrollToBottom(); // Scroll if near bottom
                } else { console.warn("Received invalid message format:", data); }
             } else {
                  console.warn("Received message while input disabled, ignoring display.");
             }
        });

        socketio.on("update_user_count", (data) => {
             console.log("Socket.IO: Update user count:", data);
             if (data && typeof data.count === 'number') {
                 userCountDisplay.textContent = data.count;
             }
        });

        socketio.on("error", (data) => { // Handles custom errors from backend
            console.error("Socket.IO: Server error received:", data.message);
            showFlashMessage(`Error: ${data.message}`, 'error');
        });

        // --- Sending Messages ---
        const sendMessage = () => {
            const message = messageInput.value.trim();
            if (message && !messageInput.disabled) {
                console.log("Sending message:", message);
                socketio.emit("message", { data: message }); // Backend expects {data: msg}
                messageInput.value = ""; // Clear input after sending
                autoResizeTextarea(); // Reset height
                messageInput.focus(); // Refocus on input
            } else if (messageInput.disabled) {
                 console.warn("Attempted to send message while disconnected.");
                 showFlashMessage("Cannot send message while disconnected.", "warning");
            }
        };

        // --- Event Listeners ---
        messageForm.addEventListener("submit", (event) => {
             event.preventDefault(); // Prevent default form submission
             sendMessage();
        });

        messageInput.addEventListener("keypress", (event) => {
            // Send on Enter key (unless Shift is pressed)
            if (event.key === "Enter" && !event.shiftKey) {
                event.preventDefault(); // Prevent newline
                sendMessage();
            }
        });

        messageInput.addEventListener('input', autoResizeTextarea);


        // --- Initial Setup ---
        window.addEventListener('load', () => {
            console.log(`Private Chat Initializing: Room=${roomCode}, User=${currentUser}`);
            // Set initial textarea size based on potential placeholder/content
            autoResizeTextarea();
            // Status message is set initially in HTML
            // SocketIO connects automatically. 'connect' handler enables input.
        });

    </script>

</body>

</html>
