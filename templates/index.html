<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Chat App</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <link rel="icon" href="{{ url_for('static', filename='favicon.png') }}" type="image/png">
</head>
<body>
    <div class="container auth-container">
        <div class="header">
            <h1>Chat App</h1>
        </div>
        <div class="main">
            <!-- Flash Messages -->
            {% include 'includes/_flash_messages.html' %}

            <form action="{{ url_for('login') }}{{ '?next=' + request.args.get('next') if request.args.get('next') else '' }}" method="post" class="auth-form">
                <h2>Log In</h2>
                <div class="form-group">
                    <label for="email" class="sr-only">Email:</label>
                    <input id="email" name="email" type="email" placeholder="Email Address" required value="{{ request.form.email or '' }}">
                </div>
                <div class="form-group">
                    <label for="password" class="sr-only">Password:</label>
                    <input id="password" name="password" type="password" placeholder="Password" required>
                </div>
                <div class="form-group">
                    <button type="submit" class="btn btn-primary btn-block">Login</button>
                </div>
                <div class="form-links">
                    <a href="{{ url_for('forget_password') }}" id="forget_password">Forgot password?</a>
                </div>
                <p class="or-separator"><span>or</span></p>
                <div class="form-group">
                     <a href="{{ url_for('register') }}" class="btn btn-secondary btn-block">Create New Account</a>
                </div>
            </form>
        </div>
    </div>
</body>
</html>
<!-- END OF FILE index.html -->
