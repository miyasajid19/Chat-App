<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Chat App</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <link rel="icon" href="{{ url_for('static', filename='favicon.png') }}" type="image/png">
    <!-- Google Fonts (Optional) -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
</head>
<body>
    <div class="container auth-container">
        <div class="header">
            <h1>Welcome to Chat App</h1>
        </div>
        <div class="main">
            <!-- Flash Messages -->
            {% include 'includes/_flash_messages.html' %}

            {# Include 'next' URL in form action for redirection after login #}
            <form action="{{ url_for('login') }}{{ '?next=' + request.args.get('next') | urlencode if request.args.get('next') else '' }}" method="post" class="auth-form">
                <h2>Log In to Your Account</h2>
                <div class="form-group">
                    <label for="email" class="sr-only">Email:</label>
                    <input id="email" name="email" type="email" placeholder="Email Address" required value="{{ request.form.email or '' }}" autocomplete="email">
                </div>
                <div class="form-group">
                    <label for="password" class="sr-only">Password:</label>
                    <input id="password" name="password" type="password" placeholder="Password" required autocomplete="current-password">
                </div>
                 {# Remember Me Checkbox #}
                 <div class="form-group form-group-checkbox">
                     <input type="checkbox" id="remember" name="remember">
                     <label for="remember">Remember me</label>
                 </div>
                <div class="form-group">
                    <button type="submit" class="btn btn-primary btn-block">Login</button>
                </div>
                <div class="form-links">
                    <a href="{{ url_for('forget_password') }}" id="forget_password">Forgot password?</a>
                </div>

                <p class="or-separator"><span>Don't have an account?</span></p> {# Changed text slightly #}

                <div class="form-group">
                     <a href="{{ url_for('register') }}" class="btn btn-secondary btn-block">Create New Account</a>
                </div>
            </form>
        </div>
    </div>
</body>
</html>
<!-- END OF FILE index.html -->
