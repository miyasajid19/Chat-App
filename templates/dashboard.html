<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard - Chat App</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <link rel="icon" href="{{ url_for('static', filename='favicon.png') }}" type="image/png">
</head>

<body>
    <div class="container dashboard-container">
        <div class="header">
            <h1>Chat Dashboard</h1>
            <div class="header-links">
                <span>Welcome, {{ username }}!</span> |
                <a href="{{ url_for('logout') }}">Logout</a>
            </div>
        </div>
        <div class="main">
            <!-- Flash Messages -->
            {% include 'includes/_flash_messages.html' %}

            <!-- Join/Create Private Room Form -->
            <form action="{{ url_for('join_room_route') }}" method="post" class="room-form section-box">
                <h3>Private Rooms</h3>
                <div class="form-group">
                    <label for="room_code" class="sr-only">Room Code to Join:</label>
                    <input id="room_code" name="room_code" type="text" placeholder="Enter 4-Letter Code to Join"
                        pattern="[A-Za-z]{4}" title="Enter exactly 4 letters" maxlength="4"
                        style="text-transform:uppercase">
                </div>
                <div class="form-group">
                    <button type="submit" id="join_room" name="join_room" value="true"
                        class="btn btn-secondary btn-block">Join Room</button>
                </div>
                <p class="or-separator"><span>or</span></p>
                <div class="form-group">
                    <button type="submit" id="create_room" name="create_room" value="true"
                        class="btn btn-primary btn-block">Create New Private Room</button>
                </div>
            </form>

            <hr class="divider">

            <!-- Link to Public Chat -->
            <div class="public-chat-link section-box">
                <h3>Public Chat</h3>
                <p>Join the general chat open to all logged-in users.</p>
                <div class="form-group">
                    <a href="{{ url_for('public_chat') }}" class="btn btn-success btn-block">Go to Public Chat</a>
                </div>
            </div>

        </div>
    </div>
    <!-- Removed inline styles -->
</body>

</html>
