<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard - Chat App</title>
    
    <link rel="icon" href="{{ url_for('static', filename='favicon.png') }}" type="image/png">
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Animate.css for animations -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css">
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; }
    </style>
</head>

<body class="bg-gradient-to-br from-indigo-500 via-purple-500 to-pink-500 min-h-screen">
    <div class="min-h-screen flex items-center justify-center p-4">
        <div class="bg-white rounded-2xl shadow-2xl w-full max-w-4xl p-8 animate__animated animate__fadeInUp">
            <!-- Header -->
            <header class="flex justify-between items-center mb-8">
                <h1 class="text-3xl font-bold text-gray-800 animate__animated animate__bounce">Chat Dashboard</h1>
                <div class="flex items-center space-x-4">
                    <span class="text-gray-600">Welcome, <span class="font-semibold text-gray-800">{{ username | e }}</span>!</span>
                    {% if is_admin %}
                    <a href="{{ url_for('admin_dashboard') }}" class="bg-purple-500 hover:bg-purple-600 text-white px-4 py-2 rounded-lg transition-colors duration-200 transform hover:scale-105">Admin</a>
                    {% endif %}
                    <a href="{{ url_for('logout') }}" class="bg-red-500 hover:bg-red-600 text-white px-4 py-2 rounded-lg transition-colors duration-200 transform hover:scale-105">Logout</a>
                </div>
            </header>

            <!-- Flash Messages -->
            {% include 'includes/_flash_messages.html' %}

            <div class="grid md:grid-cols-2 gap-8">
                <!-- Private Rooms Card -->
                <div class="bg-gradient-to-br from-blue-50 to-indigo-100 rounded-xl p-6 shadow-lg animate__animated animate__fadeInLeft">
                    <h3 class="text-2xl font-semibold text-gray-800 mb-4">Private Rooms</h3>
                    <form action="{{ url_for('join_room_route') }}" method="post" class="space-y-4">
                        <div>
                            <label for="room_code" class="block text-sm font-medium text-gray-700 mb-2">Room Code</label>
                            <input id="room_code" name="room_code" type="text" placeholder="Enter 4-letter code"
                                   pattern="[A-Za-z]{4}" title="Enter exactly 4 letters" maxlength="4"
                                   style="text-transform:uppercase" autocomplete="off"
                                   class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-transparent transition-all duration-200 uppercase">
                        </div>
                        <button type="submit" id="join_room" name="join_room" value="true"
                                class="w-full bg-blue-500 hover:bg-blue-600 text-white py-3 px-4 rounded-lg transition-all duration-200 transform hover:scale-105">
                            Join Private Room
                        </button>
                        <div class="text-center">
                            <span class="text-gray-500">or</span>
                        </div>
                        <button type="submit" id="create_room" name="create_room" value="true"
                                class="w-full bg-gradient-to-r from-green-500 to-blue-500 hover:from-green-600 hover:to-blue-600 text-white py-3 px-4 rounded-lg transition-all duration-200 transform hover:scale-105">
                            Create New Private Room
                        </button>
                    </form>
                </div>

                <!-- Public Chat Card -->
                <div class="bg-gradient-to-br from-green-50 to-emerald-100 rounded-xl p-6 shadow-lg animate__animated animate__fadeInRight">
                    <h3 class="text-2xl font-semibold text-gray-800 mb-4">Public Chat</h3>
                    <p class="text-gray-600 mb-6">Join the general chat open to all logged-in users. Anyone can see the messages here.</p>
                    <a href="{{ url_for('public_chat') }}" class="inline-block w-full bg-gradient-to-r from-emerald-500 to-teal-500 hover:from-emerald-600 hover:to-teal-600 text-white py-3 px-4 rounded-lg text-center transition-all duration-200 transform hover:scale-105">
                        Enter Public Chat
                    </a>
                </div>
            </div>
        </div>
    </div>
</body>

</html>
<!-- END OF FILE dashboard.html -->
