<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forgot Password - Chat App</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <link rel="icon" href="{{ url_for('static', filename='favicon.png') }}" type="image/png">
    <!-- Google Fonts (Optional) -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
</head>
<body>
    <div class="container auth-container">
        <div class="header">
            <h1>Reset Password</h1>
        </div>
        <div class="main">
            <!-- Flash Messages -->
            {% include 'includes/_flash_messages.html' %}

            <form action="{{ url_for('forget_password') }}" method="post" class="auth-form">
                <h2>Forgot Your Password?</h2>
                <p>Enter your email address below. If an account exists with this email, we'll send you a secure One-Time Password (OTP) to reset your password.</p>

                <div class="form-group">
                    <label for="email" class="sr-only">Email Address:</label>
                    <input id="email" name="email" type="email" placeholder="Enter your account email" required value="{{ request.form.email or '' }}" autocomplete="email">
                </div>

                <div class="form-group">
                    <button type="submit" id="submit_email" class="btn btn-primary btn-block">Send Password Reset Email</button>
                </div>

                 <div class="form-links">
                    <a href="{{ url_for('home') }}">Back to Login</a> |
                    <a href="{{ url_for('register') }}">Create Account</a>
                </div>
            </form>
        </div>
    </div>
</body>
</html>
<!-- END OF FILE forgetPassword.html -->
