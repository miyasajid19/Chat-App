<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forgot Password - Chat App</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <link rel="icon" href="{{ url_for('static', filename='favicon.png') }}" type="image/png">
</head>
<body>
    <div class="container auth-container">
        <div class="header">
            <h1>Reset Password</h1>
        </div>
        <div class="main">
            <!-- Flash Messages -->
            {% include 'includes/_flash_messages.html' %}

            <form action="{{ url_for('forget_password') }}" method="post" class="auth-form">
                <h2>Forgot Your Password?</h2>
                <p>Enter your email address below. If an account exists, we'll send you an OTP to reset your password.</p>

                <div class="form-group">
                    <label for="email" class="sr-only">Email Address:</label>
                    <input id="email" name="email" type="email" placeholder="Enter your account email" required value="{{ request.form.email or '' }}">
                </div>

                <div class="form-group">
                    <button type="submit" id="submit_email" class="btn btn-primary btn-block">Send OTP</button>
                </div>

                 <div class="form-links">
                    <a href="{{ url_for('home') }}">Back to Login</a>
                </div>
            </form>
        </div>
    </div>
</body>
</html>
<!-- END OF FILE forgetPassword.html -->
