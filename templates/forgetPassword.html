<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forgot Password - Chat App</title>
    
    <link rel="icon" href="{{ url_for('static', filename='favicon.png') }}" type="image/png">
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Animate.css for animations -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css">
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; }
    </style>
</head>
<body class="bg-gradient-to-br from-red-500 via-orange-500 to-yellow-500 min-h-screen flex items-center justify-center p-4">
    <div class="bg-white rounded-2xl shadow-2xl w-full max-w-md p-8 animate__animated animate__fadeInUp">
        <div class="text-center mb-8">
            <h1 class="text-3xl font-bold text-gray-800 mb-2 animate__animated animate__bounce">Reset Password</h1>
            <p class="text-gray-600">Forgot your password? No worries!</p>
        </div>
        
        <!-- Flash Messages -->
        {% include 'includes/_flash_messages.html' %}
        
        <form action="{{ url_for('forget_password') }}" method="post" class="space-y-6">
            <div>
                <label for="email" class="block text-sm font-medium text-gray-700 mb-2">Email Address</label>
                <input id="email" name="email" type="email" placeholder="Enter your account email" required value="{{ request.form.email or '' }}" autocomplete="email"
                       class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-red-500 focus:border-transparent transition-all duration-200 animate__animated animate__fadeInLeft">
            </div>
            <button type="submit" id="submit_email" class="w-full bg-gradient-to-r from-red-600 to-orange-600 text-white py-3 px-4 rounded-lg hover:from-red-700 hover:to-orange-700 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-red-500 transition-all duration-200 transform hover:scale-105 animate__animated animate__pulse">
                Send Password Reset Email
            </button>
        </form>
        
        <div class="mt-6 text-center space-x-4">
            <a href="{{ url_for('home') }}" class="text-red-600 hover:text-red-500 transition-colors duration-200">Back to Login</a>
            <span class="text-gray-400">|</span>
            <a href="{{ url_for('register') }}" class="text-red-600 hover:text-red-500 transition-colors duration-200">Create Account</a>
        </div>
    </div>
</body>
</html>
