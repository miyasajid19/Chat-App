<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>500 Server Error - Chat App</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <link rel="icon" href="{{ url_for('static', filename='favicon.png') }}" type="image/png">
</head>
<body>
    <div class="container error-container">
        <div class="header"><h1>500 - Internal Server Error</h1></div>
        <div class="main">
            <p>Oops! Something went wrong on our end.</p>
            <p>We've been notified and are working to fix it. Please try again later.</p>
             <div class="error-actions">
                <a href="{{ url_for('home') }}" class="btn btn-primary">Go to Homepage</a>
                 {% if 'user_id' in session %}
                <a href="{{ url_for('dashboard') }}" class="btn btn-secondary">Go to Dashboard</a>
                {% endif %}
            </div>
        </div>
    </div>
     <!-- Removed inline style -->
</body>
</html>
